plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.2'
}

group = 'com.minimals'
version = '0.2.0'

base {
    archivesName = 'minimals'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    // No mappings line: Loom defaults to Mojang's official mappings on 26.x.
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.157.0+26.2'
    // e4mc: real P2P (iroh/QUIC) replacing our World Host relay-proxy for game traffic.
    // World Host relay is kept only for friend presence + ticket delivery (see WorldHostManager).
    // compileOnly, NOT bundled: e4mc must be installed by the user as its own separate mod
    // jar in mods/ (standard e4mc distribution) — we only compile against its classes here.
    // Vendored locally (libs/) for compiling instead of a remote Maven coordinate: e4mc's
    // actual publish location (Modrinth Maven, group "maven.modrinth") uses opaque per-version
    // IDs we couldn't confirm for the 26.2 "Fabric Modern" 6.2.2 build; this file is verified correct.
    compileOnly files('libs/e4mc-fabric-6_2_2-modern.jar')
    // MixinExtras (@WrapOperation etc.) is bundled at runtime by fabric-loader 0.15.0+,
    // so we only need it on the compile classpath here, not packaged into the jar.
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.5.4'
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.5.4'

    // Flashback (the replay mod this client extends). compileOnly: it is a runtime dependency the
    // player installs themselves, never bundled here (its licence forbids redistribution).
    // Modrinth Maven: maven.modrinth:<project id or slug>:<version number>.
    compileOnly "maven.modrinth:flashback:${project.flashback_version}"

    // Flashback's ImGui binding (package imgui.moulberry90), used by the keyframe editor panels.
    // Not published anywhere: copy imgui-binding-1.90.0.jar out of your installed Flashback jar
    // (META-INF/jars/) into libs/. libs/ is gitignored, so it is never committed.
    compileOnly files('libs/imgui-binding-1.90.0.jar')
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
