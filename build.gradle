plugins {
    id 'net.fabricmc.fabric-loom' version '1.13-SNAPSHOT'
}

group = 'com.minimals'
version = '0.2.0'

base {
    archivesName = 'minimals'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    // No mappings line: Loom defaults to Mojang's official mappings on 26.x.
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.156.0+26.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
