plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.2'
}

group = 'com.minimals'
version = '0.2.0'

base {
    archivesName = 'minimals'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    // No mappings line: Loom defaults to Mojang's official mappings on 26.x.
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2'
    // e4mc (MIT, by Skye) is compiled against here and bundled as a nested jar (see processResources)
    // so players don't need to install it. Vendored in libs/ (verified 6.2.2 Fabric Modern build).
    compileOnly files('libs/e4mc-fabric-6_2_2-modern.jar')
    // Customizable Player Models (MIT, by tom5454) powers the Dressing Room "Customize" tab.
    // Compiled against here and bundled as a nested jar (see processResources), same as e4mc.
    compileOnly files('libs/cpm-fabric-26_2-0_6_27c.jar')
    // MixinExtras (@WrapOperation etc.) is bundled at runtime by fabric-loader 0.15.0+,
    // so we only need it on the compile classpath here, not packaged into the jar.
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.5.4'
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.5.4'

    // Flashback (the replay mod this client extends). compileOnly: it is a runtime dependency the
    // player installs themselves, never bundled here (its licence forbids redistribution).
    // Modrinth Maven: maven.modrinth:<project id or slug>:<version number>.
    compileOnly "maven.modrinth:flashback:${project.flashback_version}"

    // Flashback's ImGui binding (package imgui.moulberry90) ships inside the Flashback jar itself since 0.43.x,
    // so no separate libs/imgui-binding jar is needed.
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    from('libs/e4mc-fabric-6_2_2-modern.jar') {
        into 'META-INF/jars'
    }
    from('libs/cpm-fabric-26_2-0_6_27c.jar') {
        into 'META-INF/jars'
    }
    from('libs/E4MC-LICENSE.txt') {
        into 'META-INF'
    }
    from('libs/CPM-LICENSE.txt') {
        into 'META-INF'
    }
}
